# NodeSpec Community — frontend + single-origin gateway (compose stack).
#
# Same doctrine as the selfhost CLI stack's nginx (one origin, one port,
# SHIP-1(e)), but here nginx routes DIRECTLY to the sibling compose services
# instead of a Kong/CLI gateway — the per-prefix rewrites below reproduce
# exactly what the Supabase gateway did (strip the /·/v1 prefix; /realtime
# maps onto the socket mount). Mounted over the image's default config by
# deploy/community/docker-compose.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, resolved at REQUEST time via variable upstreams —
    # a literal proxy_pass hostname is resolved at STARTUP and nginx refuses
    # to boot while any sibling service is still coming up (live-caught
    # 2026-09-02: auth restarting took the whole frontend down with
    # "host not found in upstream").
    # ipv6=off: with variable upstreams nginx also asks Docker DNS for AAAA
    # records and can prefer an unroutable IPv6 answer — every proxied call
    # then 502s while `compose ps` shows all green (live-caught 2026-09-02:
    # sign-in returned nginx's HTML error page to the JSON parser).
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Large payloads ride the functions lane (git pushes, proposals).
    client_max_body_size 50m;

    # ── Supabase surface → the compose services (single origin) ────────────
    location /auth/v1/ {
        set $upstream_auth http://auth:9999;
        rewrite ^/auth/v1(/.*)$ $1 break;
        proxy_pass $upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        set $upstream_rest http://rest:3000;
        rewrite ^/rest/v1(/.*)$ $1 break;
        proxy_pass $upstream_rest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        set $upstream_realtime http://realtime-dev.supabase-realtime:4000;
        rewrite ^/realtime/v1(/.*)$ /socket$1 break;
        proxy_pass $upstream_realtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /storage/v1/ {
        set $upstream_storage http://storage:5000;
        rewrite ^/storage/v1(/.*)$ $1 break;
        proxy_pass $upstream_storage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /functions/v1/ {
        set $upstream_functions http://functions:9000;
        rewrite ^/functions/v1(/.*)$ $1 break;
        proxy_pass $upstream_functions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Edge functions can legitimately run long (imports, generators).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── OAuth discovery (RFC 8414/9728 root-insertion form) ────────────────
    # MCP clients derive metadata URLs by INSERTING /.well-known/<doc> between
    # host and the issuer's path; without this rewrite the SPA catch-all
    # answers 200 text/html and OAuth sign-in dies at discovery.
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource)(/.*)?$ {
        set $upstream_functions http://functions:9000;
        rewrite ^/\.well-known/([a-z-]+)(/.*)?$ /mcp-server/.well-known/$1 break;
        proxy_pass $upstream_functions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
