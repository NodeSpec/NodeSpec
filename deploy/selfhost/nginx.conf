# NodeSpec self-host frontend + single-origin gateway (SHIP-1(e)).
#
# One origin, one port: this nginx serves the SPA AND proxies the Supabase
# surface (auth/rest/realtime/storage/functions) to Kong on the host. Chosen
# after a live 2026-08-24 find: home/mobile networks commonly filter
# nonstandard outbound ports (8080/54321 both dropped), and enterprise
# proxies want 80/443 anyway. Externally only the frontend port exists —
# Kong's 54321 never needs a firewall opening; even the MCP endpoint rides
# /functions/v1/mcp-server on this origin.
#
# The SPA owns /admin /app /pricing /reset-password /templates /u/ — no
# collision with the five proxied prefixes (checked against App.tsx routes).

# WebSocket upgrade for /realtime/v1 (map is legal here: conf.d files are
# included inside the http{} context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Large payloads ride the functions lane (git pushes, proposals).
    client_max_body_size 50m;

    # ── Supabase surface → Kong on the host (single origin) ────────────────
    # host.docker.internal is mapped via extra_hosts: host-gateway in compose.
    location ~ ^/(auth|rest|realtime|storage|functions)/ {
        proxy_pass http://host.docker.internal:54321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Edge functions can legitimately run long (imports, generators).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── OAuth discovery (RFC 8414/9728 root-insertion form) ────────────────
    # MCP clients derive metadata URLs by INSERTING /.well-known/<doc> between
    # host and the issuer's path. Without this rewrite the SPA catch-all
    # answers 200 text/html and OAuth sign-in dies at discovery (live-caught
    # 2026-08-25, first customer VM — hosted works because mcp.nodespec.io is
    # a dedicated host). Rewritten to the function's path-appended form.
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource)(/.*)?$ {
        rewrite ^/\.well-known/([a-z-]+)(/.*)?$ /functions/v1/mcp-server/.well-known/$1 break;
        proxy_pass http://host.docker.internal:54321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    # Hashed build assets are immutable; index.html must always revalidate so
    # a redeploy is picked up on the next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
